aid: sakuu
name: Sakuu
description: >-
  Sakuu Corporation is a Silicon Valley advanced-manufacturing company that builds commercial-scale
  printing equipment for the battery and supercapacitor industries. Founded in 2016 as KeraCel and
  renamed Sakuu in 2021, it develops the Kavian platform — a dry-process electrode printing system
  that produces cathodes and anodes without solvents or drying ovens, covering NCA, NCM, LFP, LTO,
  graphite and silicon-graphite chemistries as well as sodium-ion, aluminum-ion and solid-state
  formulations. Kavian was named a TIME Best Invention of 2024 and a Fast Company World Changing
  Idea of 2025, and the Kavian 2000 platform is sold to battery makers serving AI data centers,
  energy storage, two- and three-wheel mobility, aerospace and industrial electrification. Sakuu
  sells capital equipment and process technology; it does not operate a software product, a
  developer program, or any public API.
